[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify installs devDependencies before building. Playwright is only needed
  # by the test suite, so stop its postinstall pulling a browser into the build.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Long cache for fingerprinted bundles, fonts and images.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images carry a content hash too, put there by the hashedImages plugin in
# vite.config.js, so a changed image is a new URL and an unchanged one keeps
# its URL forever. That is what makes immutable safe here. Before the hashing
# this had to be short, because a corrected crop stayed invisible for as long
# as the header said.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
