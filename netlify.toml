[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify installs devDependencies before building. Playwright is only needed
  # by the test suite, so stop its postinstall pulling a browser into the build.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Long cache for fingerprinted bundles, fonts and images.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images are NOT fingerprinted. /assets/* and /fonts/* carry a content hash in
# the filename, so they can be immutable for a year. An image keeps its name
# when its contents change, which happens often here: a crop gets corrected, a
# work is rephotographed, an artist sends a better portrait. With a week of hard
# caching, anyone who had seen the page kept the old picture for a week and the
# studio could not tell whether a fix had deployed.
#
# So: an hour of hard caching, then a week in which the browser shows the copy
# it has instantly and fetches the new one in the background. Repeat visits
# still cost nothing, and a correction is visible the same day instead of the
# next week.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
