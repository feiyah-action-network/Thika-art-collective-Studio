name: CI

# Pull request branches are covered by the pull_request trigger, so push is
# limited to main. Listing both for every branch runs each commit twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Check assets and copy rules
        run: npm run test:assets

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser checks
        run: TEST_BUILD=skip node tests/run.mjs
